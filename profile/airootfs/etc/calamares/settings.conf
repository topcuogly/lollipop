modules-search:
- local
branding: lollipop
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - lollipop-clean
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - displaymanager
  - lollipop-finish
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - lollipop-verify
  - umount
- show:
  - finished

disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
