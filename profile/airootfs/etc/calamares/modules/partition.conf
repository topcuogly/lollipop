efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: Lollipop EFI
userSwapChoices:
- none
initialSwapChoice: none
initialPartitioningChoice: erase
defaultFileSystemType: btrfs
availableFileSystemTypes:
- btrfs
- ext4
luksGeneration: luks2
preCheckEncryption: false
essentialMounts:
- live-*
- control
- ventoy
alwaysShowPartitionLabels: true
enableLuksAutomatedPartitioning: true
partitionLayout:
- name: Lollipop Boot
  filesystem: ext4
  noEncrypt: true
  mountPoint: /boot
  size: 2GiB
  minSize: 1GiB
- name: Lollipop
  filesystem: ''
  noEncrypt: false
  mountPoint: /
  size: 100%
