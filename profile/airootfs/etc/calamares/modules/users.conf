defaultGroups:
- users
- wheel
- video
- audio
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
displayAutologin: false
doAutologin: false
allowWeakPasswords: false
allowActiveDirectory: false
user:
  shell: /bin/bash
  forbidden_names:
  - root
  - live
  home_permissions: o700
hostname:
  location: EtcFile
  writeHostsFile: true
  template: lollipop
  forbidden_names:
  - localhost
autologinGroup: autologin
